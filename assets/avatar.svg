      <stop offset="0%" stop-color="#1F2A3A"></stop>
      <stop offset="55%" stop-color="#161B22"></stop>
      <stop offset="100%" stop-color="#0D1117"></stop>
    </radialGradient>
    
    <radialGradient id="hi1" cx="30%" cy="25%" r="40%">
