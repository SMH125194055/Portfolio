<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card { gap: 12px; justify-content: center; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .pill {
    display: inline-flex; align-items: center;
    padding: 5px 10px; border-radius: 4px;
    font-family: var(--font-mono); font-size: 12px; font-weight: 500;
    border: 1px solid transparent;
  }
  .p-ai          { background: rgba(124,58,237,0.14);  color: #B68BFF; border-color: rgba(124,58,237,0.32); }
  .p-backend     { background: rgba(88,166,255,0.14);  color: #79B8FF; border-color: rgba(88,166,255,0.32); }
  .p-frontend    { background: rgba(57,208,216,0.14);  color: #5BE2EA; border-color: rgba(57,208,216,0.32); }
  .p-infra       { background: rgba(63,185,80,0.14);   color: #56D068; border-color: rgba(63,185,80,0.32); }
  .p-integration { background: rgba(240,136,62,0.14);  color: #F7A766; border-color: rgba(240,136,62,0.32); }
</style></head>
<body><div class="card">
  <div class="label">Tech tag pills · category-colored</div>
  <div class="row">
    <span class="pill p-ai">PyTorch</span>
    <span class="pill p-ai">LangChain</span>
    <span class="pill p-ai">GPT-4o</span>
    <span class="pill p-ai">pgvector</span>
    <span class="pill p-backend">FastAPI</span>
    <span class="pill p-backend">Node.js</span>
    <span class="pill p-backend">Redis</span>
    <span class="pill p-frontend">Next.js 14</span>
    <span class="pill p-frontend">React Native</span>
    <span class="pill p-frontend">Tailwind</span>
    <span class="pill p-infra">PostgreSQL</span>
    <span class="pill p-infra">Docker</span>
    <span class="pill p-infra">AWS EC2</span>
    <span class="pill p-integration">Stripe</span>
    <span class="pill p-integration">HubSpot</span>
    <span class="pill p-integration">Apify</span>
  </div>
</div></body></html>
