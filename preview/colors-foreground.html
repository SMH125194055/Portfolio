<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .row2 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; flex: 1; }
  .tx { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; justify-content: center; }
  .tx .big { font-size: 22px; font-weight: 700; }
  .tx .m { font-family: var(--font-mono); font-size: 11px; color: var(--fg2); }
  .tx .n { font-size: 11px; color: var(--fg3); letter-spacing: 0.06em; text-transform: uppercase; }
</style></head>
<body><div class="card">
  <div class="label">Foreground ramp · primary → secondary → tertiary</div>
  <div class="row2">
    <div class="tx"><div class="n">fg1 · body</div><div class="big" style="color:#C9D1D9">Primary text</div><div class="m">#C9D1D9</div></div>
    <div class="tx"><div class="n">fg2 · caption</div><div class="big" style="color:#8B949E">Secondary text</div><div class="m">#8B949E</div></div>
    <div class="tx"><div class="n">fg3 · placeholder</div><div class="big" style="color:#6E7681">Tertiary text</div><div class="m">#6E7681</div></div>
  </div>
</div></body></html>
