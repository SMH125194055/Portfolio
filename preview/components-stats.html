<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card { gap: 14px; justify-content: center; padding: 22px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .stat {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 18px; display: flex; flex-direction: column; gap: 4px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
  }
  .n { font-family: var(--font-mono); font-size: 32px; font-weight: 700; line-height: 1; color: var(--accent); }
  .l { font-size: 12px; color: var(--fg2); }
</style></head>
<body><div class="card">
  <div class="label">Stat cards · count-up animation on scroll</div>
  <div class="grid">
    <div class="stat"><div class="n">15+</div><div class="l">Projects shipped</div></div>
    <div class="stat"><div class="n" style="color:#D29922">2</div><div class="l">Competition podiums</div></div>
    <div class="stat"><div class="n" style="color:#3FB950">819+</div><div class="l">GitHub commits</div></div>
    <div class="stat"><div class="n" style="color:#7C3AED">1</div><div class="l">Published paper</div></div>
  </div>
</div></body></html>
