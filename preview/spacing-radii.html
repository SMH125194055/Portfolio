<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card { gap: 14px; justify-content: center; }
  .row { display: flex; gap: 16px; align-items: flex-end; }
  .b { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .shp { width: 80px; height: 56px; background: var(--surface); border: 1px solid var(--border); }
  .px { font-family: var(--font-mono); font-size: 11px; color: var(--fg2); }
  .nm { font-size: 11px; color: var(--fg1); font-weight: 500; }
</style></head>
<body><div class="card">
  <div class="row">
    <div class="b"><div class="shp" style="border-radius:4px"></div><div class="nm">xs · pill / tag</div><div class="px">4px · --radius-xs</div></div>
    <div class="b"><div class="shp" style="border-radius:6px"></div><div class="nm">sm · input</div><div class="px">6px · --radius-sm</div></div>
    <div class="b"><div class="shp" style="border-radius:10px"></div><div class="nm">md · card</div><div class="px">10px · --radius-md</div></div>
    <div class="b"><div class="shp" style="border-radius:14px"></div><div class="nm">lg · featured</div><div class="px">14px · --radius-lg</div></div>
    <div class="b"><div class="shp" style="border-radius:20px"></div><div class="nm">xl · hero panel</div><div class="px">20px · --radius-xl</div></div>
    <div class="b"><div class="shp" style="width:56px;border-radius:999px"></div><div class="nm">pill</div><div class="px">999px · --radius-pill</div></div>
  </div>
</div></body></html>
