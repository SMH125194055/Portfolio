<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card { gap: 12px; justify-content: center; padding: 24px; }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }
  .b { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .shp { width: 100%; height: 64px; background: var(--surface); border-radius: 10px; border: 1px solid var(--border); }
  .g-accent      { box-shadow: 0 0 0 1px rgba(88,166,255,0.5),  0 10px 28px rgba(88,166,255,0.22); }
  .g-ai          { box-shadow: 0 0 0 1px rgba(124,58,237,0.5),  0 10px 28px rgba(124,58,237,0.25); }
  .g-frontend    { box-shadow: 0 0 0 1px rgba(57,208,216,0.5),  0 10px 28px rgba(57,208,216,0.22); }
  .g-infra       { box-shadow: 0 0 0 1px rgba(63,185,80,0.5),   0 10px 28px rgba(63,185,80,0.22); }
  .g-integration { box-shadow: 0 0 0 1px rgba(240,136,62,0.5),  0 10px 28px rgba(240,136,62,0.22); }
  .nm { font-size: 11px; color: var(--fg1); font-weight: 500; }
  .px { font-family: var(--font-mono); font-size: 10px; color: var(--fg2); }
</style></head>
<body><div class="card">
  <div class="label">Hover glow halos · 1px colored ring + soft drop shadow</div>
  <div class="row">
    <div class="b"><div class="shp g-accent"></div><div class="nm">accent</div><div class="px">--glow-accent</div></div>
    <div class="b"><div class="shp g-ai"></div><div class="nm">AI</div><div class="px">--glow-ai</div></div>
    <div class="b"><div class="shp g-frontend"></div><div class="nm">frontend</div><div class="px">--glow-frontend</div></div>
    <div class="b"><div class="shp g-infra"></div><div class="nm">infra</div><div class="px">--glow-infra</div></div>
    <div class="b"><div class="shp g-integration"></div><div class="nm">integration</div><div class="px">--glow-integration</div></div>
  </div>
</div></body></html>
