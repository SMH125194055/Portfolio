<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card { gap: 12px; justify-content: center; }

  .h3 { font-size: 24px; font-weight: 600; line-height: 1.3; }
  .m { font-family: var(--font-mono); font-size: 10px; color: var(--fg2); margin-left: 12px; vertical-align: middle; }
</style></head>
<body><div class="card">
  <div><span class="h1">Featured Projects</span><span class="m">h1 · 48 / 700</span></div>
  <div><span class="h2">Chatty Bot</span><span class="m">h2 · 32 / 700</span></div>
  <div><span class="h3">AI Lead Automation</span><span class="m">h3 · 24 / 600</span></div>
