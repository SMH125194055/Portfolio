<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card { gap: 10px; justify-content: center; }
  .row { display: flex; align-items: flex-end; gap: 14px; flex-wrap: nowrap; }
  .b { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .blk { background: var(--accent); border-radius: 3px; }
  .px { font-family: var(--font-mono); font-size: 10px; color: var(--fg2); }
  .nm { font-family: var(--font-mono); font-size: 9px; color: var(--fg3); }
</style></head>
<body><div class="card">
  <div class="row">
    <div class="b"><div class="blk" style="width:4px;height:4px"></div><div class="px">4</div><div class="nm">1</div></div>
    <div class="b"><div class="blk" style="width:8px;height:8px"></div><div class="px">8</div><div class="nm">2</div></div>
    <div class="b"><div class="blk" style="width:12px;height:12px"></div><div class="px">12</div><div class="nm">3</div></div>
    <div class="b"><div class="blk" style="width:16px;height:16px"></div><div class="px">16</div><div class="nm">4</div></div>
    <div class="b"><div class="blk" style="width:20px;height:20px"></div><div class="px">20</div><div class="nm">5</div></div>
    <div class="b"><div class="blk" style="width:24px;height:24px"></div><div class="px">24</div><div class="nm">6</div></div>
    <div class="b"><div class="blk" style="width:32px;height:32px"></div><div class="px">32</div><div class="nm">8</div></div>
    <div class="b"><div class="blk" style="width:40px;height:40px"></div><div class="px">40</div><div class="nm">10</div></div>
    <div class="b"><div class="blk" style="width:48px;height:48px"></div><div class="px">48</div><div class="nm">12</div></div>
    <div class="b"><div class="blk" style="width:64px;height:64px"></div><div class="px">64</div><div class="nm">16</div></div>
    <div class="b"><div class="blk" style="width:80px;height:80px"></div><div class="px">80</div><div class="nm">20</div></div>
  </div>
  <div class="label" style="margin-top: 6px;">4-pt scale · --space-1 → --space-20</div>
</div></body></html>
