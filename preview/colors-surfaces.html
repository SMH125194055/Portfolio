<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; flex: 1; }
  .sw { display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; border-radius: 8px; border: 1px solid var(--border-soft); min-height: 110px; }
  .sw .n { font-size: 11px; color: var(--fg1); font-weight: 600; }
  .sw .h { font-family: var(--font-mono); font-size: 10px; color: var(--fg2); margin-top: 2px; }
</style></head>
<body><div class="card">
  <div class="label">Surfaces · page → cards → borders</div>
  <div class="swatches">
    <div class="sw" style="background:#0D1117;border-color:#1f242c;"><div class="n">--bg</div><div class="h">#0D1117</div></div>
    <div class="sw" style="background:#0F141A;"><div class="n">--bg-elev-1</div><div class="h">#0F141A</div></div>
    <div class="sw" style="background:#161B22;"><div class="n">--surface</div><div class="h">#161B22</div></div>
    <div class="sw" style="background:#1C232C;"><div class="n">--surface-2</div><div class="h">#1C232C</div></div>
    <div class="sw" style="background:#232B36;"><div class="n">--surface-3</div><div class="h">#232B36</div></div>
    <div class="sw" style="background:#0D1117;border:1px solid #30363D;"><div class="n">--border</div><div class="h">#30363D</div></div>
  </div>
</div></body></html>
