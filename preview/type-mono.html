<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card { gap: 14px; justify-content: center; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg2); }
  .mono-block { font-family: var(--font-mono); font-size: 14px; background: #0B0F14; border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
  .c-prompt { color: var(--fg2); }
  .c-cmd    { color: var(--fg1); }
  .c-out    { color: var(--infra); }
  .c-key    { color: var(--ai); }
  .m { font-family: var(--font-mono); font-size: 10px; color: var(--fg3); }
</style></head>
<body><div class="card">
  <div><div class="eyebrow">EYEBROW · 12 / 600 / +0.08em</div></div>
  <div class="mono-block">
    <div><span class="c-prompt">$</span> <span class="c-cmd">whoami</span></div>
    <div><span class="c-out">→ syed_muhammad_huzaifa</span></div>
    <div><span class="c-key">RAG</span> · <span class="c-key">Agentic AI</span> · Next.js · FastAPI</div>
  </div>
  <div class="m">JetBrains Mono · 14px · used for code, tech tags, SMH_ logo</div>
</div></body></html>
