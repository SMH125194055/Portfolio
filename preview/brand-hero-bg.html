<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 0; min-height: 100vh; }
  .hero {
    flex: 1; padding: 24px 28px; display: flex; flex-direction: column; gap: 12px;
    background:
      radial-gradient(600px 300px at 20% 0%, rgba(88,166,255,0.18), transparent 60%),
      radial-gradient(500px 250px at 80% 20%, rgba(124,58,237,0.18), transparent 60%),
      linear-gradient(180deg, transparent 0%, transparent 100%);
    position: relative;
  }
  .hero::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(88,166,255,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(88,166,255,0.06) 1px, transparent 1px);
    background-size: 32px 32px;
    mask-image: radial-gradient(ellipse at 50% 50%, black 30%, transparent 70%);
  }
  .inner { position: relative; z-index: 1; }
  .eyebrow { font-family: var(--font-mono); font-size: 11px; color: var(--infra); letter-spacing: 0.04em; }
  .name { font-size: 36px; font-weight: 800; letter-spacing: -0.02em; line-height: 1; color: var(--fg1); margin-top: 6px; }
  .role { font-size: 16px; color: var(--accent); margin-top: 4px; font-weight: 600; }
  .role .cur { display: inline-block; width: 2px; height: 16px; background: var(--accent); vertical-align: -2px; margin-left: 3px; animation: blink 1.1s steps(2,end) infinite; }
  @keyframes blink { 50% { opacity: 0 } }
  .nm { font-family: var(--font-mono); font-size: 10px; color: var(--fg3); margin-top: 8px; }
</style></head>
<body><div class="card">
  <div class="hero">
    <div class="inner">
      <div class="eyebrow">$ whoami</div>
      <div class="name">Syed Muhammad Huzaifa</div>
      <div class="role">AI Engineer<span class="cur"></span></div>
      <div class="nm">Hero background · grid + dual radial gradient (the ONLY place backgrounds are used)</div>
    </div>
  </div>
</div></body></html>
