<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card { gap: 12px; justify-content: center; padding: 18px 22px; }
  .nav {
    height: 56px; padding: 0 18px; border-radius: 10px;
    background: rgba(13,17,23,0.72); backdrop-filter: blur(12px);
    border: 1px solid var(--border); display: flex; align-items: center; gap: 24px;
    position: relative;
  }
  .logo { font-family: var(--font-mono); font-weight: 700; color: var(--fg1); display: inline-flex; align-items: baseline; gap: 1px; font-size: 15px; }
  .cursor { display: inline-block; width: 8px; height: 16px; background: var(--accent); margin-left: 2px; animation: blink 1.1s steps(2,end) infinite; transform: translateY(2px); }
  @keyframes blink { 50% { opacity: 0 } }
  .links { display: flex; gap: 18px; margin-left: auto; }
  .links a { font-size: 13px; color: var(--fg2); text-decoration: none; padding-bottom: 4px; }
  .links a.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
  .progress { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: linear-gradient(to right, var(--accent) 40%, transparent 40%); border-radius: 10px; }
</style></head>
<body><div class="card">
  <div class="label">Navbar · fixed, blurred, scroll-progress underline</div>
  <div class="nav">
    <span class="logo">SMH<span class="cursor"></span></span>
    <div class="links">
      <a>About</a>
      <a>Skills</a>
      <a class="active">Projects</a>
      <a>Experience</a>
      <a>Contact</a>
    </div>
    <div class="progress"></div>
  </div>
</div></body></html>
